name: Build Termux armv7a .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load pinned versions
        run: |
          cat versions.env >> "$GITHUB_ENV"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg binutils xz-utils curl

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Zig
        run: |
          curl -fL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xJf zig.tar.xz
          echo "${PWD}/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Locate Android NDK
        run: |
          NDK_DIR=$(ls -d "${ANDROID_NDK_LATEST_HOME:-/usr/local/lib/android/sdk/ndk/*}" 2>/dev/null | sort -V | tail -1)
          echo "Using Android NDK: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build OpenCode + OpenTUI Termux .deb
        run: |
          sh scripts/build-all.sh

      - name: Verify package contents
        run: |
          DEB="out/opencode_${OPENCODE_VERSION}-${PACKAGE_REVISION}_arm.deb"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          sha256sum "$DEB" > "${DEB}.sha256"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-arm-deb
          path: |
            out/opencode_*_arm.deb
            out/opencode_*_arm.deb.sha256

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/opencode_*_arm.deb
            out/opencode_*_arm.deb.sha256

name: Build Termux armv7a .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load pinned versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' versions.env >> "$GITHUB_ENV"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg binutils xz-utils curl unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Zig
        run: |
          curl -fL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xJf zig.tar.xz
          echo "${PWD}/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Locate Android NDK
        run: |
          NDK_DIR=""
          for candidate in "${ANDROID_NDK_LATEST_HOME:-}" "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}"; do
            if [ -n "$candidate" ] && [ -d "$candidate/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/${ANDROID_API}" ]; then
              NDK_DIR="$candidate"
              break
            fi
          done
          if [ -z "$NDK_DIR" ] && [ -d /usr/local/lib/android/sdk/ndk ]; then
            for candidate in $(find /usr/local/lib/android/sdk/ndk -mindepth 1 -maxdepth 1 -type d | sort -Vr); do
              if [ -d "$candidate/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/${ANDROID_API}" ]; then
                NDK_DIR="$candidate"
                break
              fi
            done
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "Preinstalled Android NDK not found; downloading NDK r27c..."
            curl -fL "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" -o /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d /tmp/ndk
            NDK_DIR="/tmp/ndk/android-ndk-r27c"
            rm -f /tmp/ndk.zip
          fi
          echo "Using Android NDK: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build OpenCode + OpenTUI Termux .deb
        run: |
          sh scripts/build-all.sh

      - name: Verify package contents
        run: |
          DEB="out/opencode_${OPENCODE_VERSION}-${PACKAGE_REVISION}_arm.deb"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          sha256sum "$DEB" > "${DEB}.sha256"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-arm-deb
          path: |
            out/opencode_*_arm.deb
            out/opencode_*_arm.deb.sha256

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/opencode_*_arm.deb
            out/opencode_*_arm.deb.sha256
